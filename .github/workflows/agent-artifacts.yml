name: Agent artifacts

# Builds the runnable agent artifacts and attaches them to the GitHub Release for a tag, so
# consumers can download and run an agent without cloning the repo.
#
# Attaches: the cross-platform JVM agent fat JAR (bundles kable-btleplug natives for
# linux/darwin/win × x86_64+aarch64, so the one JAR runs on x86_64/ARM Linux, Apple Silicon, and
# Windows), plus native agent-rs binaries for Linux x86_64, Linux aarch64 (Pi/ARM SBCs), and Windows
# x86_64 — for devs who want a single-file agent without a JRE.
# macOS ships as a universal RemoteBleAgentRs.app rather than a bare binary: TCC kills any process
# that touches CoreBluetooth without an NSBluetoothAlwaysUsageDescription in its main bundle, and
# honours the grant only when LaunchServices started the app. That is the same bundle
# agent-rs/run-agent-rs.sh assembles locally, so the distributed and from-source paths match.
# Not built here (by decision): the on-device Android APK.
#
# Runs automatically on a release tag, and can be dispatched manually against an existing tag
# (e.g. to backfill) without pushing a tag. Note: pushing a `v*` tag builds+attaches these agent
# binaries but does NOT publish to Maven Central — the Central publish (release.yml) is manual
# (workflow_dispatch) on purpose, so interim GitHub-only releases don't spend Central quota.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + attach artifacts to (e.g. v0.7.0)"
        required: true

permissions:
  contents: write # upload release assets

jobs:
  release-version:
    name: Release version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Verify tag and version sources
        run: bash scripts/check-release-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

  jvm-agent-jar:
    needs: release-version
    name: JVM agent fat JAR (cross-platform)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      # :agent applies the Android KMP library plugin, so configuring the project needs the SDK
      # even though jvmFatJar only touches the jvm() target.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build fat JAR
        run: ./gradlew :agent:jvmFatJar --no-configuration-cache

      - name: Generate SHA-256 checksum
        run: |
          for artifact in agent/build/libs/remoteble-agent-*-all.jar; do
            sha256sum "$artifact" > "$artifact.sha256"
          done

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: agent/build/libs/remoteble-agent-*-all.jar*

  agent-rs-linux:
    needs: release-version
    name: agent-rs (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # btleplug's Linux (BlueZ/D-Bus) backend needs libdbus headers to compile.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rs/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('agent-rs/Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release --locked

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/agent-rs dist/remoteble-agent-rs-linux-x86_64
          chmod +x dist/remoteble-agent-rs-linux-x86_64
          sha256sum dist/remoteble-agent-rs-linux-x86_64 > dist/remoteble-agent-rs-linux-x86_64.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            agent-rs/dist/remoteble-agent-rs-linux-x86_64
            agent-rs/dist/remoteble-agent-rs-linux-x86_64.sha256

  agent-rs-linux-arm64:
    needs: release-version
    name: agent-rs (linux aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rs/target
          key: ${{ runner.os }}-cargo-release-aarch64-${{ hashFiles('agent-rs/Cargo.lock') }}

      # cross runs the build in a target-arch container (no host QEMU/toolchain juggling); the
      # foreign-arch libdbus is installed inside it via agent-rs/Cross.toml. (If this repo's plan has
      # native arm64 hosted runners, `runs-on: ubuntu-24.04-arm` + the plain apt/cargo steps from the
      # x86_64 job above is a simpler swap.)
      - name: Install cross
        run: cargo install cross --locked

      - name: Build (release, aarch64)
        run: cross build --release --locked --target aarch64-unknown-linux-gnu

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/agent-rs dist/remoteble-agent-rs-linux-aarch64
          chmod +x dist/remoteble-agent-rs-linux-aarch64
          sha256sum dist/remoteble-agent-rs-linux-aarch64 > dist/remoteble-agent-rs-linux-aarch64.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            agent-rs/dist/remoteble-agent-rs-linux-aarch64
            agent-rs/dist/remoteble-agent-rs-linux-aarch64.sha256

  agent-rs-macos:
    needs: release-version
    name: agent-rs (macOS universal .app)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rs/target
          key: ${{ runner.os }}-cargo-release-macos-universal-${{ hashFiles('agent-rs/Cargo.lock') }}

      # Both architectures, so one asset serves Apple Silicon and Intel. The runner is arm64; the
      # x86_64 half is an ordinary cross-compile with no extra toolchain.
      - name: Build (release, both architectures)
        run: |
          cargo build --release --locked --bin agent-rs --target aarch64-apple-darwin
          cargo build --release --locked --bin agent-rs --target x86_64-apple-darwin

      # The bundle is the deliverable, not the binary. macOS resolves the Bluetooth usage
      # description through the main bundle, and only honours a grant for an app LaunchServices
      # started -- a loose executable in a bin directory gets neither, which is why this ships as
      # an .app and is installed as a cask.
      - name: Assemble RemoteBleAgentRs.app
        run: |
          set -euo pipefail
          app="dist/RemoteBleAgentRs.app"
          rm -rf dist && mkdir -p "$app/Contents/MacOS"
          cp macos/Info.plist "$app/Contents/Info.plist"
          lipo -create -output "$app/Contents/MacOS/agent-rs" \
            target/aarch64-apple-darwin/release/agent-rs \
            target/x86_64-apple-darwin/release/agent-rs
          lipo -info "$app/Contents/MacOS/agent-rs"
          # Ad-hoc, matching run-agent-rs.sh. TCC keys a grant to the signature, so each new build
          # is a new identity and the Bluetooth prompt returns after an upgrade. A Developer ID
          # signature would make the identity stable; that needs an Apple account and secrets, and
          # is deliberately not half-built here.
          codesign -f -s - --identifier com.warsha.remoteble.agent-rs "$app/Contents/MacOS/agent-rs"
          codesign -f -s - "$app"
          codesign --verify --strict --verbose=2 "$app"

      - name: Stage the archive
        run: |
          set -euo pipefail
          cd dist
          # `ditto` keeps the bundle's permissions and signature intact; a plain `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent RemoteBleAgentRs.app remoteble-agent-rs-macos-universal.app.zip
          shasum -a 256 remoteble-agent-rs-macos-universal.app.zip > remoteble-agent-rs-macos-universal.app.zip.sha256
          rm -rf RemoteBleAgentRs.app

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            agent-rs/dist/remoteble-agent-rs-macos-universal.app.zip
            agent-rs/dist/remoteble-agent-rs-macos-universal.app.zip.sha256

  agent-rs-windows:
    needs: release-version
    name: agent-rs (windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # btleplug's Windows backend is WinRT — no system packages to install (unlike Linux/libdbus).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rs/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('agent-rs/Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release --locked

      - name: Stage binary
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/agent-rs.exe dist/remoteble-agent-rs-windows-x86_64.exe
          $artifact = "dist/remoteble-agent-rs-windows-x86_64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $artifact).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $artifact)" | Out-File -NoNewline -Encoding ascii "$artifact.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            agent-rs/dist/remoteble-agent-rs-windows-x86_64.exe
            agent-rs/dist/remoteble-agent-rs-windows-x86_64.exe.sha256
