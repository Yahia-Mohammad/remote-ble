name: Rust agent container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example v0.10.0)"
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/remoteble-agent-rs

jobs:
  smoke:
    name: Build and smoke-test amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - name: Build local amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-rs/Dockerfile
          platforms: linux/amd64
          load: true
          tags: remoteble-agent-rs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify version and fail-closed listener
        run: agent-rs/container-smoke.sh remoteble-agent-rs:ci

  release-version:
    name: Release version consistency
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Verify tag and version sources
        run: bash scripts/check-release-version.sh "${{ inputs.tag || github.ref_name }}"

  publish:
    name: Publish multi-architecture GHCR image
    needs: [smoke, release-version]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The arm64 leg builds under QEMU emulation: agent-rs/Dockerfile runs a native
    # `cargo build --release` inside the target platform's image, so the whole Rust
    # dependency tree compiles emulated. The amd64 leg finishes in ~30s off a warm
    # type=gha cache, but arm64 starts cold and emulated, and a timeout exports no
    # cache — so a too-tight limit costs a retry that is no faster than the first try.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}
            type=sha
          labels: |
            org.opencontainers.image.title=RemoteBLE Rust agent
            org.opencontainers.image.description=RemoteBLE native agent using host BlueZ over D-Bus
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
      # Build and push are deliberately separate.
      #
      # Buildx exports its cache as part of a successful build+push, so when the two are one step a
      # failed push discards the layers too. The arm64 leg compiles the whole Rust dependency tree
      # under QEMU — around 23 minutes — and GHCR rejected the v0.10.0 push twice with a transient
      # 403, meaning each retry paid that cost again to reach the same failing push.
      #
      # Building to `type=cacheonly` first exports the cache on its own. If the push below then
      # fails, the expensive work survives and a retry is a cache hit plus an upload.
      - name: Build amd64/arm64 and export the layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-rs/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Resolves entirely from the cache above, so this step is an export and an upload rather than
      # a rebuild. No cache-to: the cache is already exported, and re-exporting on success only
      # duplicates work. Attestations are generated here because they are produced at export time.
      - name: Publish amd64/arm64 manifest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-rs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Record published digest
        run: echo "${{ steps.push.outputs.digest }}" > image-digest.txt
      - name: Archive image digest
        uses: actions/upload-artifact@v7
        with:
          name: remoteble-agent-rs-image-digest
          path: image-digest.txt
          if-no-files-found: error
