name: Rust agent container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example v0.10.0)"
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/remoteble-agent-rs

jobs:
  smoke:
    name: Build and smoke-test amd64 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - name: Build local amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-rs/Dockerfile
          platforms: linux/amd64
          load: true
          tags: remoteble-agent-rs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify version and fail-closed listener
        run: agent-rs/container-smoke.sh remoteble-agent-rs:ci

  release-version:
    name: Release version consistency
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Verify tag and version sources
        run: bash scripts/check-release-version.sh "${{ inputs.tag || github.ref_name }}"

  publish:
    name: Publish multi-architecture GHCR image
    needs: [smoke, release-version]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}
            type=sha
          labels: |
            org.opencontainers.image.title=RemoteBLE Rust agent
            org.opencontainers.image.description=RemoteBLE native agent using host BlueZ over D-Bus
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
      - name: Build and publish amd64/arm64 manifest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-rs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published digest
        run: echo "${{ steps.push.outputs.digest }}" > image-digest.txt
      - name: Archive image digest
        uses: actions/upload-artifact@v7
        with:
          name: remoteble-agent-rs-image-digest
          path: image-digest.txt
          if-no-files-found: error
