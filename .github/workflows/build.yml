name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-version:
    name: Release version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sources
        run: bash scripts/check-release-version.sh

  rust:
    name: Rust format, lint, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rs/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('agent-rs/Cargo.lock') }}
      - name: Format, lint, and test
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

  jvm-android:
    name: JVM build + test, Android klibs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-jvm-android-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}

      # Compiles every host-buildable target (JVM + Android; iOS is skipped automatically on a
      # non-macOS host — see the separate ios-klibs job) and runs the JVM unit test suite.
      # Kable (incl. the JVM btleplug backend) resolves from Maven Central — no source build.
      - name: Build + test
        run: ./gradlew build

  ios-klibs:
    name: iOS klib compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-ios-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}

      # Verifies the iOS klibs compile (:protocol, :client-sdk, :client-ui, :agent). Does not
      # link or run iOS test binaries — see docs/build-and-testing.md#the-ios-test-caveat.
      # No module has an iosX64() target (Intel Simulator): Compose Multiplatform 1.11.1 doesn't
      # publish for it and Apple Silicon covers device + simulator, so every module ships only
      # iosArm64 (device) + iosSimulatorArm64 (simulator).
      - name: Compile iOS klibs
        run: |
          ./gradlew \
            :protocol:compileKotlinIosArm64 :protocol:compileKotlinIosSimulatorArm64 \
            :client-sdk:compileKotlinIosArm64 :client-sdk:compileKotlinIosSimulatorArm64 \
            :client-ui:compileKotlinIosArm64 :client-ui:compileKotlinIosSimulatorArm64 \
            :agent:compileKotlinIosArm64 :agent:compileKotlinIosSimulatorArm64
