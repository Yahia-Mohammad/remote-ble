name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jvm-android:
    name: JVM build + test, Android klibs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-jvm-android-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}

      # Compiles every host-buildable target (JVM + Android; iOS is skipped automatically on a
      # non-macOS host — see the separate ios-klibs job) and runs the JVM unit test suite.
      # Kable (incl. the JVM btleplug backend) resolves from Maven Central — no source build.
      - name: Build + test
        run: ./gradlew build

  ios-klibs:
    name: iOS klib compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-ios-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}

      # Verifies the iOS klibs compile (:protocol, :client-sdk, :client-ui, :agent). Does not
      # link or run iOS test binaries — see docs/build-and-testing.md#the-ios-test-caveat.
      # :agent (like :client-ui) has no iosX64() target — Compose Multiplatform 1.11.1 doesn't
      # publish for the Intel Simulator — so only iosArm64/iosSimulatorArm64 apply to it.
      - name: Compile iOS klibs
        run: |
          ./gradlew \
            :protocol:compileKotlinIosArm64 :protocol:compileKotlinIosX64 :protocol:compileKotlinIosSimulatorArm64 \
            :client-sdk:compileKotlinIosArm64 :client-sdk:compileKotlinIosX64 :client-sdk:compileKotlinIosSimulatorArm64 \
            :client-ui:compileKotlinIosArm64 :client-ui:compileKotlinIosSimulatorArm64 \
            :agent:compileKotlinIosArm64 :agent:compileKotlinIosSimulatorArm64
