name: Release gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Cross-agent conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-conformance-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}

      - name: Kotlin conformance adapters
        run: ./gradlew conformanceTest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Rust conformance adapters
        working-directory: agent-rs
        run: cargo test --locked

  consumer-jvm:
    name: Published JVM consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Publish SDK dependency closure to Maven local
        run: ./gradlew :protocol:publishToMavenLocal :log:publishToMavenLocal :client-sdk:publishToMavenLocal -PRELEASE_SIGNING_ENABLED=false

      - name: Compile a clean JVM consumer against published coordinates
        run: |
          VERSION="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          ./gradlew -p consumer-tests/jvm check -PremoteBleVersion="$VERSION"

  consumer-android:
    name: Published Android consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The fixture is a standalone Gradle build, so it cannot see the repo's local.properties;
      # it resolves the SDK location from ANDROID_HOME, which this action guarantees.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Publish SDK dependency closure to Maven local
        run: ./gradlew :protocol:publishToMavenLocal :log:publishToMavenLocal :client-sdk:publishToMavenLocal -PRELEASE_SIGNING_ENABLED=false

      # Resolves the `.aar` variant (client-sdk-android -> protocol-android, log-android), which the
      # JVM gate never touches: Android selects through different Gradle metadata attributes and can
      # break independently of a healthy `jvm` closure.
      - name: Compile a clean Android consumer against published coordinates
        run: |
          VERSION="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          ./gradlew -p consumer-tests/android compileDebugKotlin -PremoteBleVersion="$VERSION"

  consumer-apple:
    name: Published KMP/Apple consumer
    # Kotlin/Native Apple targets only build on macOS — this gate cannot run on the Linux runners
    # the other consumer gates use.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Publish SDK dependency closure to Maven local
        run: ./gradlew :protocol:publishToMavenLocal :log:publishToMavenLocal :client-sdk:publishToMavenLocal -PRELEASE_SIGNING_ENABLED=false

      # Resolves the klib variants (client-sdk-iosarm64 / -iossimulatorarm64 and their protocol/log
      # counterparts). Explicit compile tasks rather than `check`: these fixtures carry no tests, so
      # `check` would pass without compiling anything.
      - name: Compile a clean KMP/Apple consumer against published coordinates
        run: |
          VERSION="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          ./gradlew -p consumer-tests/kmp compileKotlinIosArm64 compileKotlinIosSimulatorArm64 -PremoteBleVersion="$VERSION"

  simulated-socket-e2e:
    name: Simulated agent socket E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Drive the ordinary SDK through the simulated agent
        run: ./gradlew :client-sdk:jvmTest --tests '*BleAgentOverWebSocketTest.simulatedProfileDrivesTheOrdinaryClientOverARealSocket'

  kotlin-coverage:
    name: Kotlin JVM coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate merged coverage reports
        run: ./gradlew coverageReport
      - name: Archive Kotlin coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-jvm-coverage
          path: build/reports/kover/
          if-no-files-found: error

  rust-coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Measure Rust line coverage
        run: cargo tarpaulin --engine llvm --out Xml
      - name: Archive Rust coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rust-line-coverage
          path: agent-rs/cobertura.xml
          if-no-files-found: error

  secrets:
    name: Secret policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked history and working tree
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.3
        with:
          entrypoint: sh
          args: >-
            -c "git config --global --add safe.directory /github/workspace &&
            gitleaks git --redact --verbose --report-format sarif --report-path gitleaks-results.sarif ."
      - name: Archive secret-scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  rust-policy:
    name: Rust advisories and licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install policy tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: Check known Rust advisories
        run: cargo audit
      - name: Check Rust dependency licenses and sources
        run: cargo deny check advisories licenses sources

  sbom:
    name: Source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: remoteble-source.spdx.json
      - name: Archive SBOM
        uses: actions/upload-artifact@v7
        with:
          name: remoteble-source-spdx
          path: remoteble-source.spdx.json
          if-no-files-found: error
