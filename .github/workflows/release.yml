name: Release

# Publish :protocol + :client-sdk to Maven Central. This is MANUAL (workflow_dispatch) on purpose:
# most releases (0.8.1 / 0.8.2 / 0.8.3 …) ship agent binaries to GitHub Releases via
# agent-artifacts.yml but are NOT published to Central — that conserves the monthly Central file
# quota (272 files/release, 1,000/month). Only deliberate milestone publishes (e.g. 0.9.0) run this
# workflow, consolidating the accumulated SDK changes into one Central spend.
#
# To publish: Actions → Release → Run workflow, supply the version tag (e.g. `v0.9.0`). The tag must
# already exist and its VERSION_NAME (gradle.properties) is the source of truth for the artifact
# version — the guard below refuses to publish if the tag and VERSION_NAME disagree.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish to Maven Central (must exist, e.g. v0.9.0)"
        required: true
        type: string

jobs:
  maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Safety: Central publishes are irreversible, so refuse a tag/VERSION_NAME mismatch (e.g. an
      # old tag, or a tag that was cut before the version bump). Compares the tag minus its leading
      # `v` against VERSION_NAME in gradle.properties.
      - name: Verify tag matches VERSION_NAME
        run: |
          version_name="$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          tag_version="${TAG#v}"
          echo "Tag input:     ${TAG} (version ${tag_version})"
          echo "VERSION_NAME:  ${version_name}"
          if [ "${tag_version}" != "${version_name}" ]; then
            echo "::error::Tag ${TAG} does not match VERSION_NAME ${version_name} at that ref — refusing to publish."
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-release-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}

      # Publishes :protocol + :client-sdk (KMP publication + JVM/Android/iOS per-target ones)
      # to the Central Portal and releases the deployment. Signing + credentials come from
      # encrypted secrets (never in the tree). Config cache is disabled for the publish tasks.
      - name: Publish + release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
