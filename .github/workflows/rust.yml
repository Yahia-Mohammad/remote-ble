name: Rust agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref. Deliberately not applied to the publishing workflows
# (agent-artifacts, agent-container, release) — cancelling a half-finished publish is worse
# than letting a superseded one run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-rs:
    name: agent-rs build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-rs
    steps:
      - uses: actions/checkout@v4

      # btleplug's Linux (BlueZ/D-Bus) backend needs libdbus headers to compile.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent-rs/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
