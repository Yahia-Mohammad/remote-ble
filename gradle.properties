# Published Maven coordinates. GROUP + VERSION_NAME are read by both the Gradle build
# (root build.gradle.kts allprojects) and the vanniktech maven-publish plugin. Cut a release
# by bumping VERSION_NAME here (SemVer) and tagging. Tracked in git — NOT in local.properties.
GROUP=dev.warsha.remoteble
VERSION_NAME=0.10.0

# Maven Central publishing (vanniktech). OSSRH is sunset — Central Portal is the only path.
# Signing is required by Central; enabled here and fed a GPG key via CI secrets
# (ORG_GRADLE_PROJECT_signingInMemoryKey / …Password) or ~/.gradle for local release.
# Verify POM generation locally without a key using -PRELEASE_SIGNING_ENABLED=false.
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true

# Shared POM metadata (per-module POM_NAME / POM_DESCRIPTION live in each module's
# gradle.properties). Developer email is intentionally omitted from public POMs.
POM_URL=https://github.com/Yahia-Mohammad/remote-ble
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/Yahia-Mohammad/remote-ble
POM_SCM_CONNECTION=scm:git:https://github.com/Yahia-Mohammad/remote-ble.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Yahia-Mohammad/remote-ble.git
POM_DEVELOPER_ID=Yahia-Mohammad
POM_DEVELOPER_NAME=Yahia Hassan
POM_DEVELOPER_URL=https://github.com/Yahia-Mohammad

# Kotlin/Gradle
kotlin.code.style=official

# Multiplatform + AGP + Kotlin/Native need far more than the 512m/384m defaults
# (the daemon was exhausting Metaspace mid-build).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# The Kotlin/Native compiler runs in its own JVM; its default heap is too small for the release
# framework's whole-program LTO devirtualization over this dependency graph (Compose/Ktor/Kable) —
# it OOMs ("Java heap space" in DevirtualizationAnalysis) while linking the release XCFramework.
# Only exercised by the opt-in `-PiosFramework` release link; a plain build never spawns it.
# 6g proved insufficient for the current graph (still OOM'd mid-link), and so was 12g: Rig B
# (2026-07-29) hit "Java heap space" three times on a 24GB host, including with 70% of RAM free,
# so this is the compiler's real demand rather than host memory pressure. A clean (non-incremental)
# release link is what needs the headroom — incremental ones often squeak by, which is why this
# fails intermittently and misleads.
# Measured on a 24GB host (Rig B, 2026-07-29): 12g OOM'd even with 70% of RAM free, and 14g OOM'd
# at 79% free on a link that had to redo most of the graph — so these are real heap limits, not
# host memory pressure. Demand scales with how much the link must actually recompile, which is why
# the same setting can pass on an incremental run and fail on a colder one; don't read a single
# success as proof a value is sufficient. 16g has linked reliably here, but needs ~70% of RAM free
# to be allocatable at all — below that the JVM fails to start rather than failing to compile.
kotlin.native.jvmArgs=-Xmx16g

# Android client target (Phase 7). Kable's Android variant pulls AndroidX (androidx.core,
# startup), so the consumer must opt in. Jetifier stays off — everything is already AndroidX.
android.useAndroidX=true

# Reuse the configuration phase across builds when nothing config-relevant changed.
org.gradle.configuration-cache=true
