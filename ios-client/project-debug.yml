# Debug-linking XcodeGen spec — identical to project.yml except that it links the **debug**
# XCFramework. NOT the source of truth for what ships: project.yml is, and it points at release.
#
# Why it exists: the same as ios-agent/project-debug.yml. The release link's whole-program
# devirtualization fails unpredictably for want of memory (gap 11): on 2026-10-03 it failed for the
# simulator slice while an agent JVM and a second Gradle daemon were running, and passed on a plain
# rerun. The debug framework links in seconds and is a valid vehicle for on-device verification.
# Keep it until gap 11 is fixed.
#
#   ./gradlew :client-ui:assembleRemoteBleClientDebugXCFramework -PiosFramework
#   cd ios-client && xcodegen generate --spec project-debug.yml
name: RemoteBleClient
options:
  bundleIdPrefix: dev.warsha.remoteble.iosclient
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  RemoteBleClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.warsha.remoteble.iosclient
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_MODULE_NAME: RemoteBleClientApp
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    dependencies:
      - framework: ../client-ui/build/XCFrameworks/debug/RemoteBleClient.xcframework
        embed: true
