# XcodeGen spec — run `xcodegen generate` to produce RemoteBleClient.xcodeproj.
# (Hand-writing a .pbxproj is error-prone; this YAML is the source of truth instead.)
#
# This project has no business logic of its own — the whole UI (RemoteBleApp) and the
# scan/connect/GATT orchestration (RemoteBleController) live in :client-ui's commonMain (Compose
# Multiplatform), on top of :client-sdk. This is purely the launcher shell every iOS Compose
# Multiplatform app needs: an App/ContentView/ComposeView trio hosting ComposeUIViewController.
name: RemoteBleClient
options:
  bundleIdPrefix: dev.warsha.remoteble.iosclient
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  RemoteBleClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.warsha.remoteble.iosclient
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        # The Kotlin framework is also named "RemoteBleClient"; if the app's own Swift module shared
        # that name, `import RemoteBleClient` would resolve to itself ("part of module … ignoring
        # import") and the framework's MainViewControllerKt would be out of scope. Give the app a
        # distinct module name so the import unambiguously targets the framework.
        PRODUCT_MODULE_NAME: RemoteBleClientApp
        # :client-ui ships no iosX64 slice (Intel simulator was dropped), so the app must not try
        # to build an x86_64 simulator slice — there'd be no framework arch to link against and the
        # Kotlin symbols would appear "not in scope". Apple-Silicon simulators build arm64 anyway.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    dependencies:
      # Produced by `:client-ui:assembleRemoteBleClientReleaseXCFramework -PiosFramework`.
      - framework: ../client-ui/build/XCFrameworks/release/RemoteBleClient.xcframework
        embed: true
